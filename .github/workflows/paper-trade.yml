name: paper-trade-session

on:
  schedule:
    # 04:05 UTC = 09:35 IST, Monday to Friday. GitHub cron can run a few minutes late.
    - cron: "5 4 * * 1-5"
  workflow_dispatch: {}   # lets you start it by hand from the GitHub mobile app

concurrency:
  group: paper-trade
  cancel-in-progress: false   # a second start waits instead of double-trading

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 345    # must end before the 6 hour job limit; bot exits at 15:15 IST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -u bot.py
        env:
          ONE_DAY: "1"
          CAPITAL: "4000"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
