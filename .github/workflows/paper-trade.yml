name: paper-trade-session

on:
  # The weekday schedule now runs on the EC2 server (deploy/). No cron here, so two bots never trade at once.
  workflow_dispatch: {}   # lets you start it by hand from the GitHub mobile app

concurrency:
  group: paper-trade
  cancel-in-progress: false   # a second start waits instead of double-trading

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 350    # must end before the 6 hour job limit; bot exits at 15:15 IST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -u bot.py
        env:
          ONE_DAY: "1"
          LLM_MODE: "shadow"   # off | shadow (record AI opinion, trade anyway) | gate (skip what the AI rejects)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CAPITAL: "4000"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
