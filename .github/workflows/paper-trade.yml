name: paper-trade-session

on:
  schedule:
    # IST = UTC + 5:30, Monday to Friday. Several start times because GitHub often drops or delays
    # scheduled runs. The concurrency guard below keeps it to one session; extras exit right away.
    - cron: "0 4 * * 1-5"    # 09:30 IST
    - cron: "30 4 * * 1-5"   # 10:00 IST
    - cron: "30 5 * * 1-5"   # 11:00 IST
  workflow_dispatch: {}   # lets you start it by hand from the GitHub mobile app

concurrency:
  group: paper-trade
  cancel-in-progress: false   # a second start waits instead of double-trading

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 350    # must end before the 6 hour job limit; bot exits at 15:15 IST
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -u bot.py
        env:
          ONE_DAY: "1"
          CAPITAL: "4000"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
