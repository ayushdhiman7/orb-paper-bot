name: candidate-collector-tests

on:
  push:
    branches: ["phase2/**", "phase3/**", "phase3-*"]
  pull_request:
    branches: ["main"]

jobs:
  candidate-collector:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q test_candidate_collector.py test_nifty_universe.py test_indicators.py test_angel_websocket.py test_angel_websocket_1m.py test_phase3_runtime.py test_nifty50_bot_runtime.py test_nifty50_position_manager.py test_sentiment_client.py
