name: dashboard-build

on:
  push:
    branches: [main, "feature/react-dashboard-rebuild"]
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard-build.yml"
  pull_request:
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
