name: Webhook and dashboard checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/bot-dashboard-webhooks-sse"]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest fastapi python-dotenv supabase pandas-market-calendars
      - run: python -m pytest -q tests/test_webhook.py tests/test_dashboard_webhooks.py
      - run: python -m compileall -q dashboard-api webhook.py

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
