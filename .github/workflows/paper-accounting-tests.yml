name: paper-accounting-tests

on:
  push:
    branches: ["main", "phase1/**"]
  pull_request:
    branches: ["main"]

jobs:
  accounting:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q test_bot.py test_backtest.py
