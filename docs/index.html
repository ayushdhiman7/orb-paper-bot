<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ORB Paper Bot</title>
<meta name="theme-color" content="#0d1117">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0d1117; --surface: #161b22; --surface2: #1c232d; --line: #2a323d;
    --text: #e6edf3; --muted: #8b949e; --pos: #3fb950; --neg: #f85149; --accent: #58a6ff; --warn: #d29922;
    --r: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
  body { padding: 0 16px max(28px, env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }
  .top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: max(14px, env(safe-area-inset-top)) 0 10px; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font-size: 1.15rem; margin: 0; letter-spacing: .01em; }
  .status { color: var(--muted); font-size: .78rem; margin: 2px 0 10px; }
  button { font: inherit; color: var(--text); cursor: pointer; }
  .btn { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 7px 14px; font-size: .88rem; }
  .btn:disabled { opacity: .6; }
  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
  .tab { background: none; border: 0; border-radius: 9px; padding: 9px 4px; font-size: .86rem; color: var(--muted); }
  .tab[aria-selected="true"] { background: var(--surface2); color: var(--text); font-weight: 600; box-shadow: inset 0 0 0 1px var(--line); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .panel { padding-top: 14px; }
  .panel[hidden] { display: none; }
  .hero { margin: 2px 0 14px; }
  .hero .k { color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; }
  .hero .v { font-size: 2.4rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
  .tile .k { color: var(--muted); font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; }
  .tile .v { font-size: 1.05rem; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin-bottom: 14px; }
  .card h2 { font-size: .8rem; margin: 0 0 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .pos { color: var(--pos); } .neg { color: var(--neg); } .mut { color: var(--muted); }
  svg { width: 100%; height: auto; display: block; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 1px 12px; padding: 11px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; padding-top: 0; }
  .row:last-child { padding-bottom: 0; }
  .sym { font-weight: 650; }
  .badge { font-size: .68rem; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); margin-left: 6px; color: var(--muted); white-space: nowrap; }
  .badge.live { color: var(--accent); border-color: rgba(88,166,255,.5); }
  .amt { font-weight: 650; text-align: right; font-variant-numeric: tabular-nums; }
  .meta { color: var(--muted); font-size: .8rem; }
  .meta.r { text-align: right; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
  .chips .lbl { color: var(--muted); font-size: .75rem; align-self: center; margin-right: 2px; }
  .chip { background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 5px 12px; font-size: .8rem; color: var(--muted); }
  .chip[aria-pressed="true"] { color: var(--text); border-color: var(--accent); background: rgba(88,166,255,.12); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 8px 4px; font-size: .86rem; border-top: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; border-top: 0; }
  details { border-top: 1px solid var(--line); }
  details:first-of-type { border-top: 0; }
  summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 1px 12px; padding: 11px 0; }
  summary::-webkit-details-marker { display: none; }
  .sub { padding: 0 0 8px 10px; border-left: 2px solid var(--line); margin: 0 0 10px 2px; }
  .sub .row { padding: 7px 0; }
  .verdict { border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; border: 1px solid var(--line); background: var(--surface); }
  .verdict.bad { border-color: rgba(248,81,73,.55); }
  .verdict.warn { border-color: rgba(210,153,34,.6); }
  .verdict.ok { border-color: rgba(63,185,80,.55); }
  .verdict b { display: block; margin-bottom: 2px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .two .card { margin: 0; }
  .kv { display: flex; justify-content: space-between; gap: 8px; font-size: .84rem; padding: 3px 0; }
  .kv span:first-child { color: var(--muted); }
  .empty, .err { color: var(--muted); text-align: center; padding: 22px 8px; font-size: .92rem; }
  .err { color: var(--neg); }
  .note { color: var(--muted); font-size: .75rem; margin: 10px 0 0; }
  footer { color: var(--muted); font-size: .72rem; text-align: center; margin: 24px 0 8px; }

  /* Responsive trading-terminal refresh */
  body { max-width: 1280px; padding: 0 24px max(32px, env(safe-area-inset-bottom)); }
  .top { padding-bottom: 14px; border-bottom: 1px solid var(--line); background: rgba(13,17,23,.94); backdrop-filter: blur(14px); }
  .bar { min-height: 42px; }
  h1 { font-size: 1.35rem; letter-spacing: -.025em; }
  .status { margin: 4px 0 14px; }
  .tabs { max-width: 620px; gap: 6px; }
  .tab { padding: 10px 12px; transition: background .15s ease, color .15s ease; }
  .tab:hover { color: var(--text); background: rgba(255,255,255,.035); }
  .btn { padding: 9px 15px; transition: border-color .15s ease, background .15s ease; }
  .btn:hover { border-color: var(--accent); background: var(--surface2); }
  .panel { padding-top: 22px; }
  .hero { margin: 0; padding: 8px 0; }
  .hero .k { font-size: .75rem; letter-spacing: .09em; }
  .hero .v { font-size: clamp(2.5rem, 4vw, 3.5rem); letter-spacing: -.045em; }
  .tiles { gap: 12px; margin-bottom: 18px; }
  .tile { padding: 15px 16px; border-radius: 14px; transition: border-color .15s ease, transform .15s ease; }
  .tile:hover { border-color: #3c4654; transform: translateY(-1px); }
  .tile .k { letter-spacing: .07em; }
  .tile .v { font-size: clamp(1rem, 1.5vw, 1.25rem); margin-top: 5px; }
  .card { padding: 18px 20px; margin-bottom: 16px; border-radius: 16px; }
  .card h2 { font-size: .74rem; letter-spacing: .09em; margin-bottom: 14px; }
  .row { padding: 13px 0; }
  .sym { letter-spacing: -.01em; }
  .badge { padding: 2px 9px; }
  .meta { font-size: .78rem; }
  .chip { padding: 7px 13px; transition: border-color .15s ease, background .15s ease; }
  .chip:hover { border-color: var(--accent); color: var(--text); }
  table { min-width: 360px; }
  th, td { padding: 11px 9px; }
  .verdict { padding: 15px 18px; }
  .note { line-height: 1.55; }
  @media (min-width: 900px) {
    #p-overview { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; align-items: start; }
    #p-overview > .hero { grid-column: span 5; align-self: center; }
    #p-overview > .tiles { grid-column: span 7; margin: 0; }
    #p-overview > .card { margin: 0; min-width: 0; }
    #p-overview > .open-card { grid-column: 1 / -1; }
    #p-overview > .chart-card, #p-overview > .recent-card { grid-column: span 6; }
    #p-overview .row { grid-template-columns: minmax(0, 1fr) auto; }
    #p-history, #p-stocks, #p-backtest { max-width: 1100px; }
    #p-backtest .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    #p-backtest .two { gap: 14px; }
  }
  @media (max-width: 700px) {
    body { padding-left: 14px; padding-right: 14px; }
    .top { padding-bottom: 10px; }
    h1 { font-size: 1.15rem; }
    .tabs { gap: 3px; }
    .tab { padding: 9px 3px; font-size: .8rem; }
    .panel { padding-top: 16px; }
    .tiles { gap: 7px; }
    .tile { padding: 10px 9px; }
    .tile .k { font-size: .63rem; }
    .tile .v { font-size: .92rem; white-space: normal; overflow-wrap: anywhere; }
    .card { padding: 14px; border-radius: 13px; }
    .row { gap: 3px 8px; }
    .badge { margin-left: 3px; padding: 1px 6px; }
    th, td { padding: 9px 6px; }
    .two { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div class="top">
  <div class="bar">
    <h1>ORB Paper Bot</h1>
    <div style="display:flex;gap:8px"><button class="btn" id="signout" type="button" hidden>Sign out</button><button class="btn" id="refresh" type="button" hidden>Refresh</button></div>
  </div>
  <p class="status" id="status">Loading...</p>
  <div class="tabs" id="dashboard-tabs" role="tablist" aria-label="Sections" hidden>
    <button class="tab" role="tab" id="t-overview" data-tab="overview" aria-selected="true" aria-controls="p-overview">Overview</button>
    <button class="tab" role="tab" id="t-history" data-tab="history" aria-selected="false" aria-controls="p-history">History</button>
    <button class="tab" role="tab" id="t-stocks" data-tab="stocks" aria-selected="false" aria-controls="p-stocks">Stocks</button>
    <button class="tab" role="tab" id="t-backtest" data-tab="backtest" aria-selected="false" aria-controls="p-backtest">Backtest</button>
  </div>
</div>

<section id="auth-panel" class="card" style="max-width:460px;margin:24px auto">
  <h2>Private dashboard sign-in</h2>
  <p class="note" style="margin-top:0">Sign in with your authorized email. A secure magic link will be sent to your inbox.</p>
  <form id="login-form">
    <label for="login-email" class="meta" style="display:block;margin:12px 0 6px">Email address</label>
    <input id="login-email" type="email" autocomplete="email" required placeholder="you@example.com" style="width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit">
    <button class="btn" id="login-button" type="submit" style="margin-top:12px;width:100%">Email me a sign-in link</button>
    <p class="note" id="auth-message" role="status" aria-live="polite"></p>
  </form>
</section>
<section class="panel" id="p-overview" role="tabpanel" aria-labelledby="t-overview" hidden></section>
<section class="panel" id="p-history" role="tabpanel" aria-labelledby="t-history" hidden></section>
<section class="panel" id="p-stocks" role="tabpanel" aria-labelledby="t-stocks" hidden></section>
<section class="panel" id="p-backtest" role="tabpanel" aria-labelledby="t-backtest" hidden></section>

<footer>Simulated trades only. Not financial advice.</footer>

<script>
const SUPABASE_URL = "https://gbqmvnekxsckzjzcorac.supabase.co";
// Publishable key: safe to expose, it can only do what the read-only table policies allow.
const SUPABASE_KEY = "sb_publishable_xqMJstPMLis5zzOIxityFw_Fz32fdv3";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});
let accessToken = null;

const state = { trades: [], bt: null, lab: null, tab: "overview", range: "30", side: "all", reason: "all", note: "Loading..." };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (v) => { if (v === null || v === undefined || v === "") return null; const n = Number(v); return Number.isFinite(n) ? n : null; };
const inr = (n) => n == null ? "-" : (n < 0 ? "-" : n > 0 ? "+" : "") + "₹" + Math.abs(n).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const inrPlain = (n) => n == null ? "-" : "₹" + n.toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const cls = (n) => (n == null ? "" : n > 0 ? "pos" : n < 0 ? "neg" : "");
const tick = (s) => String(s).replace(".NS", "");
const istDay = (d) => new Date(d).toLocaleDateString("en-CA", { timeZone: "Asia/Kolkata" });
const istTime = (d) => new Date(d).toLocaleString("en-IN", { timeZone: "Asia/Kolkata", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const istClock = (d) => new Date(d).toLocaleTimeString("en-IN", { timeZone: "Asia/Kolkata", hour: "2-digit", minute: "2-digit" });
const shortDay = (iso) => new Date(iso + "T00:00:00Z").toLocaleDateString("en-IN", { timeZone: "UTC", day: "numeric", month: "short" });

// ---------- derived data ----------
function split(all) {
  const open = all.filter((t) => t.status === "open");
  const closed = all.filter((t) => t.status !== "open").sort((a, b) => new Date(a.ts) - new Date(b.ts));
  return { open, closed };
}
function unrealised(t) {
  const last = num(t.last_price), entry = num(t.entry), qty = num(t.qty);
  if (last == null || entry == null || qty == null) return null;
  return (last - entry) * qty * (t.side === "BUY" ? 1 : -1);
}
function stats(trades) {
  const pnl = trades.map((t) => Number(t.pnl));
  const wins = pnl.filter((p) => p > 0).length;
  return { n: trades.length, total: pnl.reduce((a, b) => a + b, 0), winRate: trades.length ? (wins / trades.length) * 100 : null };
}

// ---------- shared pieces ----------
function tradeRow(t) {
  const pnl = Number(t.pnl);
  return `<div class="row">
    <div><span class="sym">${esc(tick(t.symbol))}</span><span class="badge">${esc(t.side)}</span><span class="badge">${esc(t.reason || "")}</span>${aiBadge(t)}</div>
    <div class="amt ${cls(pnl)}">${inr(pnl)}</div>
    <div class="meta">${esc(t.qty)} sh &middot; ${Number(t.entry).toFixed(2)} &rarr; ${Number(t.exit).toFixed(2)}</div>
    <div class="meta r">${esc(istTime(t.ts))}</div>
  </div>`;
}
function aiBadge(t) {
  return t.llm_decision ? `<span class="badge" title="${esc(t.llm_reason || "")}">AI: ${esc(t.llm_decision)}</span>` : "";
}
function aiCard(closed) {
  const g = { take: [], skip: [] };
  closed.forEach((t) => { if (g[t.llm_decision]) g[t.llm_decision].push(t); });
  if (!g.take.length && !g.skip.length) return "";
  const row = (label, arr) => { const s = stats(arr); return `<tr><td>${label}</td><td>${s.n}</td><td>${s.winRate == null ? "-" : Math.round(s.winRate) + "%"}</td><td class="${cls(arr.length ? s.total : null)}">${arr.length ? inr(s.total) : "-"}</td></tr>`; };
  return `<div class="card"><h2>AI second opinion</h2>
    <table><thead><tr><th>AI said</th><th>Trades</th><th>Win</th><th>Net P&amp;L</th></tr></thead><tbody>${row("Take", g.take)}${row("Skip", g.skip)}</tbody></table>
    <p class="note">The AI only advises: trades are taken either way unless the bot is in gate mode. Wait for 30 or more trades before judging whether it adds anything.</p></div>`;
}
function emptyBox(msg) { return `<div class="empty">${esc(msg)}</div>`; }

function lineChart(closed) {
  if (!closed.length) return emptyBox("The chart appears after the first closed trade.");
  let run = 0;
  const pts = [0].concat(closed.map((t) => (run += Number(t.pnl))));
  const W = 340, H = 150, L = 6, R = 6, T = 12, B = 12;
  const min = Math.min(0, ...pts), max = Math.max(0, ...pts), span = max - min || 1;
  const x = (i) => L + (pts.length === 1 ? 0 : (i / (pts.length - 1)) * (W - L - R));
  const y = (v) => T + (1 - (v - min) / span) * (H - T - B);
  const d = pts.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join(" ");
  const last = pts[pts.length - 1], color = last >= 0 ? "var(--pos)" : "var(--neg)";
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative profit and loss, now ${esc(inr(last))}">
    <line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)" stroke-dasharray="4 4"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(pts.length - 1)}" cy="${y(last)}" r="4" fill="${color}"/>
    <text x="${W - R}" y="10" fill="var(--muted)" font-size="10" text-anchor="end">${esc(inr(max))}</text>
    <text x="${L}" y="${H - 1}" fill="var(--muted)" font-size="10">${esc(inr(min))}</text></svg>`;
}

// ---------- Overview ----------
function renderOverview() {
  const { open, closed } = split(state.trades);
  const s = stats(closed);
  const today = istDay(new Date());
  const todayPnl = closed.filter((t) => istDay(t.ts) === today).reduce((a, t) => a + Number(t.pnl), 0);
  const openPnls = open.map(unrealised).filter((v) => v != null);
  const openTotal = openPnls.length ? openPnls.reduce((a, b) => a + b, 0) : null;

  let openCard = "";
  if (open.length) {
    const latest = open.map((t) => t.last_price_ts).filter(Boolean).sort().pop();
    openCard = `<div class="card open-card"><h2>Open positions</h2>${open.map((t) => {
      const u = unrealised(t), last = num(t.last_price);
      return `<div class="row">
        <div><span class="sym">${esc(tick(t.symbol))}</span><span class="badge">${esc(t.side)}</span><span class="badge live">OPEN</span>${aiBadge(t)}</div>
        <div class="amt ${cls(u)}">${u == null ? "-" : inr(u)}</div>
        <div class="meta">${esc(t.qty)} sh &middot; in ${Number(t.entry).toFixed(2)} &middot; now ${last == null ? "-" : last.toFixed(2)}</div>
        <div class="meta r">${esc(istTime(t.ts))}</div></div>`;
    }).join("")}
      <p class="note">Prices are delayed about 15 minutes${latest ? ", last updated " + esc(istClock(latest)) : ""}. Open P&amp;L is before costs.</p></div>`;
  }

  $("p-overview").innerHTML = `
    <div class="hero"><div class="k">Total P&amp;L (closed trades)</div><div class="v ${cls(s.total)}">${inr(s.total)}</div></div>
    <div class="tiles">
      <div class="tile"><div class="k">Today</div><div class="v ${cls(todayPnl)}">${inr(todayPnl)}</div></div>
      <div class="tile"><div class="k">Open P&amp;L</div><div class="v ${cls(openTotal)}">${openTotal == null ? "-" : inr(openTotal)}</div></div>
      <div class="tile"><div class="k">Win rate</div><div class="v">${s.winRate == null ? "-" : Math.round(s.winRate) + "%"}</div></div>
    </div>
    ${openCard}
    <div class="card chart-card"><h2>Cumulative P&amp;L</h2>${lineChart(closed)}</div>
    <div class="card recent-card"><h2>Recent trades</h2>${closed.length ? [...closed].reverse().slice(0, 8).map(tradeRow).join("") : emptyBox("No closed trades yet. The bot runs on weekdays and some days it takes no trade.")}</div>`;
}

// ---------- History ----------
function chips(name, label, options) {
  return `<div class="chips" role="group" aria-label="${esc(label)}"><span class="lbl">${esc(label)}</span>${options.map(([v, t]) =>
    `<button type="button" class="chip" data-filter="${name}" data-value="${esc(v)}" aria-pressed="${state[name] === v}">${esc(t)}</button>`).join("")}</div>`;
}
function dayBars(days) {
  if (!days.length) return emptyBox("No closed trades in this range.");
  const W = 340, H = 150, L = 6, R = 6, T = 14, B = 16;
  const vals = days.map((d) => d.pnl), min = Math.min(0, ...vals), max = Math.max(0, ...vals), span = max - min || 1;
  const y = (v) => T + (1 - (v - min) / span) * (H - T - B);
  const slot = (W - L - R) / days.length, bw = Math.max(2, Math.min(24, slot * 0.7));
  const bars = days.map((d, i) => {
    const cx = L + slot * i + slot / 2, y0 = y(0), y1 = y(d.pnl);
    return `<rect x="${(cx - bw / 2).toFixed(1)}" y="${Math.min(y0, y1).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1.5, Math.abs(y1 - y0)).toFixed(1)}" rx="2" fill="${d.pnl >= 0 ? "var(--pos)" : "var(--neg)"}"><title>${esc(shortDay(d.day))}: ${esc(inr(d.pnl))}</title></rect>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Net profit or loss per day">
    <line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>${bars}
    <text x="${L}" y="${H - 2}" fill="var(--muted)" font-size="10">${esc(shortDay(days[0].day))}</text>
    <text x="${W - R}" y="${H - 2}" fill="var(--muted)" font-size="10" text-anchor="end">${esc(shortDay(days[days.length - 1].day))}</text>
    <text x="${W - R}" y="10" fill="var(--muted)" font-size="10" text-anchor="end">${esc(inr(max))}</text></svg>`;
}
function renderHistory() {
  const { closed } = split(state.trades);
  const map = new Map();
  closed.forEach((t) => {
    const day = istDay(t.ts);
    if (!map.has(day)) map.set(day, { day, pnl: 0, n: 0, wins: 0, trades: [] });
    const d = map.get(day), p = Number(t.pnl);
    d.pnl += p; d.n += 1; d.wins += p > 0 ? 1 : 0; d.trades.push(t);
  });
  let days = [...map.values()].sort((a, b) => a.day.localeCompare(b.day));
  if (state.range !== "all") {
    const cutoff = new Date(Date.now() - Number(state.range) * 86400000);
    days = days.filter((d) => new Date(d.day + "T00:00:00+05:30") >= cutoff);
  }
  const total = days.reduce((a, d) => a + d.pnl, 0), green = days.filter((d) => d.pnl > 0).length;
  $("p-history").innerHTML = `
    ${chips("range", "Range", [["7", "7 days"], ["30", "30 days"], ["all", "All"]])}
    <div class="tiles">
      <div class="tile"><div class="k">Net P&amp;L</div><div class="v ${cls(total)}">${inr(total)}</div></div>
      <div class="tile"><div class="k">Days traded</div><div class="v">${days.length}</div></div>
      <div class="tile"><div class="k">Green days</div><div class="v">${green}/${days.length}</div></div>
    </div>
    <div class="card"><h2>Profit or loss per day</h2>${dayBars(days)}</div>
    <div class="card"><h2>By day</h2>${days.length ? [...days].reverse().map((d) => `
      <details><summary><div><span class="sym">${esc(shortDay(d.day))}</span><span class="badge">${d.n} trade${d.n > 1 ? "s" : ""}</span></div>
        <div class="amt ${cls(d.pnl)}">${inr(d.pnl)}</div>
        <div class="meta">${d.wins} win, ${d.n - d.wins} loss</div><div class="meta r">tap for trades</div></summary>
        <div class="sub">${d.trades.slice().reverse().map(tradeRow).join("")}</div></details>`).join("") : emptyBox("Nothing to show for this range.")}</div>`;
}

// ---------- Stocks ----------
function renderStocks() {
  const { closed } = split(state.trades);
  const reasons = [...new Set(closed.map((t) => t.reason).filter(Boolean))].sort();
  const rows = closed.filter((t) => (state.side === "all" || t.side === state.side) && (state.reason === "all" || t.reason === state.reason));
  const by = new Map();
  rows.forEach((t) => {
    const k = tick(t.symbol);
    if (!by.has(k)) by.set(k, []);
    by.get(k).push(t);
  });
  const table = [...by.entries()].map(([k, v]) => ({ k, ...stats(v) })).sort((a, b) => b.total - a.total);
  $("p-stocks").innerHTML = `
    ${chips("side", "Side", [["all", "All"], ["BUY", "Buy"], ["SELL", "Sell"]])}
    ${chips("reason", "Exit", [["all", "All"]].concat(reasons.map((r) => [r, r])))}
    ${aiCard(closed)}
    <div class="card"><h2>By stock</h2>${table.length ? `<table><thead><tr><th>Stock</th><th>Trades</th><th>Win</th><th>Net P&amp;L</th></tr></thead><tbody>${table.map((r) =>
      `<tr><td class="sym">${esc(r.k)}</td><td>${r.n}</td><td>${Math.round(r.winRate)}%</td><td class="${cls(r.total)}">${inr(r.total)}</td></tr>`).join("")}</tbody></table>` : emptyBox("No closed trades match these filters.")}</div>
    <div class="card"><h2>Trades (${rows.length})</h2>${rows.length ? [...rows].reverse().slice(0, 50).map(tradeRow).join("") : emptyBox("No trades to list.")}</div>`;
}

// ---------- Backtest ----------
const pct = (v) => (v == null ? "-" : v.toFixed(0) + "%");
function metricTiles(m) {
  const pf = m.pf == null ? "inf" : m.pf.toFixed(2);
  return `<div class="tiles">
    <div class="tile"><div class="k">Trades</div><div class="v">${m.n}</div></div>
    <div class="tile"><div class="k">Win rate</div><div class="v">${pct(m.win)}</div></div>
    <div class="tile"><div class="k">Per trade</div><div class="v ${cls(m.exp)}">${inr(m.exp)}</div></div>
    <div class="tile"><div class="k">Profit factor</div><div class="v">${esc(pf)}</div></div>
    <div class="tile"><div class="k">Total</div><div class="v ${cls(m.total)}">${inr(m.total)}</div></div>
    <div class="tile"><div class="k">Max drawdown</div><div class="v">${inrPlain(m.maxdd)}</div></div></div>`;
}
function splitCard(title, m, days) {
  return `<div class="card"><h2>${esc(title)}</h2>
    <div class="kv"><span>Days</span><span>${days}</span></div><div class="kv"><span>Trades</span><span>${m.n}</span></div>
    <div class="kv"><span>Win rate</span><span>${pct(m.win)}</span></div>
    <div class="kv"><span>Per trade</span><span class="${cls(m.exp)}">${inr(m.exp)}</span></div>
    <div class="kv"><span>Total</span><span class="${cls(m.total)}">${inr(m.total)}</span></div></div>`;
}
function labCard(row) {
  if (!row || !row.result || !Array.isArray(row.result.variants)) return "";
  const r = row.result, g = r.gross || {}, c = r.with_costs || {};
  const rows = r.variants.map((x) => `<tr><td>${esc(x.name)}<div class="meta">${esc(x.verdict)} &middot; ${esc(x.best.stop)}% / ${esc(x.best.rr)}x</div></td>
    <td class="${cls(x.train.total)}">${Math.round(x.train.total)}</td><td class="${cls(x.test.total)}">${Math.round(x.test.total)}</td><td>${esc(x.test.n)}</td></tr>`).join("");
  return `<div class="card"><h2>Strategy lab (${esc(r.variants.length)} variants)</h2>
    <p class="note" style="margin:0 0 10px">Before costs the baseline made ${esc(inr(g.total))} over ${esc(g.n)} trades (${esc(inr(g.exp))} per trade). After costs: ${esc(inr(c.total))}.</p>
    <table><thead><tr><th>Variant</th><th>Train</th><th>Test</th><th>Trades</th></tr></thead><tbody>${rows}</tbody></table>
    <p class="note">Run ${esc(istTime(row.created_at))}. ${esc(r.meta.tried)} combinations were tried on the same days, so a good-looking result can be luck. Confirm with fresh paper trading.</p></div>`;
}
function renderBacktest() {
  const row = state.bt, el = $("p-backtest"), lab = labCard(state.lab);
  if (!row || !row.result) {
    el.innerHTML = lab || `<div class="card">${emptyBox("No backtest saved yet. On GitHub open Actions, choose backtest, tap Run workflow, then come back here.")}</div>`;
    return;
  }
  const r = row.result, b = r.baseline, v = String(b.verdict || "");
  const tone = /^REJECT|^NOT EVAL/.test(v) ? "bad" : /^VALIDATION/.test(v) ? "warn" : "ok";
  const rrs = [...new Set(r.grid.map((g) => g.rr))], stops = [...new Set(r.grid.map((g) => g.stop))];
  const maxAbs = Math.max(1, ...r.grid.map((g) => Math.abs(g.total)));
  const cell = (g) => {
    const a = Math.min(0.55, (Math.abs(g.total) / maxAbs) * 0.55 + 0.08);
    const bg = g.total >= 0 ? `rgba(63,185,80,${a})` : `rgba(248,81,73,${a})`;
    return `<td style="background:${bg};text-align:center;border-radius:6px">${Math.round(g.total)}</td>`;
  };
  el.innerHTML = `
    <p class="status" style="margin-top:0">Run on ${esc(istTime(row.created_at))} &middot; ${esc(r.meta.days)} days (${esc(shortDay(r.meta.first))} to ${esc(shortDay(r.meta.last))}) &middot; ${esc(r.meta.symbols.map(tick).join(", "))}</p>
    <div class="verdict ${tone}"><b>Verdict</b>${esc(v)}</div>
    <div class="card"><h2>Baseline (stop ${esc(b.stop)}%, target ${esc(b.rr)}x risk)</h2>${metricTiles(b)}
      <p class="note">After ${esc(r.meta.cost_pct)}% costs and ${esc(r.meta.slippage_pct)}% slippage per side, on ₹${esc(r.meta.capital)} capital.</p></div>
    <div class="card"><h2>Net P&amp;L (Rs) by setting</h2>
      <table><thead><tr><th>Stop \\ Target</th>${rrs.map((x) => `<th>${esc(x)}x</th>`).join("")}</tr></thead><tbody>${stops.map((s) =>
        `<tr><td>${esc(s)}%</td>${rrs.map((x) => cell(r.grid.find((g) => g.stop === s && g.rr === x))).join("")}</tr>`).join("")}</tbody></table>
      <p class="note">${esc(r.positive)} of ${esc(r.cells)} settings were profitable. A real edge shows a broad area of positive cells, not one or two lucky ones.</p></div>
    <div class="card"><h2>Best on training days, judged on unseen days (stop ${esc(r.best.stop)}%, target ${esc(r.best.rr)}x)</h2>
      <div class="two">${splitCard("Train", r.train, r.train.days)}${splitCard("Test", r.test, r.test.days)}</div>
      ${r.overfit_warning ? '<p class="note" style="color:var(--warn)">Warning: results on unseen days are under half of the training results. A common sign of overfitting.</p>' : ""}</div>
    <p class="note">Free 5-minute data covers only about 60 days, so this is a smoke test, not proof of an edge.</p>` + lab;
}

// ---------- wiring ----------
function render() {
  $("status").textContent = state.note;
  ["overview", "history", "stocks", "backtest"].forEach((t) => {
    $("p-" + t).hidden = state.tab !== t;
    $("t-" + t).setAttribute("aria-selected", String(state.tab === t));
  });
  ({ overview: renderOverview, history: renderHistory, stocks: renderStocks, backtest: renderBacktest })[state.tab]();
}
document.addEventListener("click", (e) => {
  const tab = e.target.closest(".tab");
  if (tab) { state.tab = tab.dataset.tab; try { localStorage.setItem("orb_tab", state.tab); } catch (_) {} render(); window.scrollTo(0, 0); return; }
  const chip = e.target.closest(".chip");
  if (chip) { state[chip.dataset.filter] = chip.dataset.value; render(); }
});

async function load() {
  if (!accessToken) return;
  const btn = $("refresh");
  btn.disabled = true;
  state.note = "Loading private data...";
  $("status").textContent = state.note;
  try {
    const { data, error } = await supabase.functions.invoke("dashboard-data", {
      headers: { Authorization: "Bearer " + accessToken }
    });
    if (error) throw error;
    if (!data || !Array.isArray(data.trades) || !Array.isArray(data.backtests)) throw new Error("Unexpected response from private dashboard API");
    state.trades = data.trades;
    state.bt = data.backtests.find((x) => x.result && x.result.kind !== "lab") || null;
    state.lab = data.backtests.find((x) => x.result && x.result.kind === "lab") || null;
    state.note = "Private data updated " + istClock(new Date());
  } catch (error) {
    state.note = "Could not load private data. " + (error?.message || "Please sign in again or try Refresh.");
  } finally {
    btn.disabled = false;
    render();
  }
}

function setAuthenticated(session) {
  accessToken = session?.access_token || null;
  $("auth-panel").hidden = Boolean(accessToken);
  $("dashboard-tabs").hidden = !accessToken;
  $("refresh").hidden = !accessToken;
  $("signout").hidden = !accessToken;
  ["overview", "history", "stocks", "backtest"].forEach((t) => {
    $("p-" + t).hidden = !accessToken || state.tab !== t;
  });
  if (!accessToken) {
    state.trades = [];
    state.bt = null;
    state.lab = null;
    state.note = "Sign in to view private paper-trading data.";
    render();
  } else {
    load();
  }
}

$("login-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const button = $("login-button"), message = $("auth-message");
  const email = $("login-email").value.trim();
  button.disabled = true;
  message.textContent = "Sending sign-in link...";
  try {
    const { error } = await supabase.auth.signInWithOtp({
      email,
      options: { emailRedirectTo: window.location.origin + window.location.pathname }
    });
    if (error) throw error;
    message.textContent = "If this email is authorized, a sign-in link has been sent. Check your inbox.";
  } catch (error) {
    message.textContent = error?.message || "Could not send sign-in link.";
  } finally {
    button.disabled = false;
  }
});

$("signout").addEventListener("click", async () => {
  $("signout").disabled = true;
  try { await supabase.auth.signOut(); } finally {
    accessToken = null;
    state.trades = [];
    state.bt = null;
    state.lab = null;
    $("signout").disabled = false;
    setAuthenticated(null);
  }
});

supabase.auth.onAuthStateChange((_event, session) => {
  setAuthenticated(session);
});
try { const t = localStorage.getItem("orb_tab"); if (["overview", "history", "stocks", "backtest"].includes(t)) state.tab = t; } catch (_) {}
$("refresh").addEventListener("click", load);
render();
supabase.auth.getSession().then(({ data }) => setAuthenticated(data.session));
setInterval(() => { if (document.visibilityState === "visible" && accessToken) load(); }, 60000);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
